services:
  postgres:
    image: postgres:17
    container_name: job-tracker-postgres
    restart: no
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - job_tracker_postgres_data:/var/lib/postgresql/data

volumes:
  job_tracker_postgres_data:

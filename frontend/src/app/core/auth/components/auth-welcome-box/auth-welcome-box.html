<div class="auth-welcome-box__content">
  <h2>{{ isRegister() ? 'Hello, welcome!' : 'Welcome back!' }}</h2>
  <p>{{ isRegister() ? "Already have an account?" : "Don't have an account?" }}</p>
  <button class="app-btn app-btn--inverse"
          [routerLink]="isRegister() ? '/login' : '/register'">{{ isRegister() ? 'Login' : 'Register' }}
  </button>
</div>

<section class="overview">
  <div class="overview__header">
    <div>
      <h1>System Overview</h1>
      <p>Tracking {{ stats()?.active ?? 0 }} active applications.</p>
    </div>

    <button class="export-btn" type="button" (click)="exportReport()">
      <span class="material-symbols-outlined">download</span>
      Export Report
    </button>
  </div>

  <div class="overview__grid">
    @for (card of cards(); track card.title) {
      <article class="stat-card">
        <div class="stat-card__top">
          <span class="stat-card__title p__grey-upper-heading">{{ card.title }}</span>

          <span class="material-symbols-outlined stat-card__icon">
            {{ card.icon }}
          </span>
        </div>

        <h2>{{ card.value }}</h2>

        <p
          class="stat-card__subtitle"
        >
          {{ card.subtitle }}
        </p>
      </article>
    }
  </div>
</section>
